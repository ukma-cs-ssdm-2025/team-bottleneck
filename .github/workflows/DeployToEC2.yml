name: Deploy to EC2
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT_DIR: team-bottleneck
      ALLOWED_HOSTS_PROD: "16.170.148.253,localhost,127.0.0.1"
      DEBUG_PROD: "False"
      RDS_DB_NAME: "postgres"
      RDS_USERNAME: "MaFiN"
      RDS_PORT: "5432"
      STRIPE_PUBLIC_KEY: "pk_test_51SKjS5HtnK8GZIavQHUhE48lrRc4PvyMVd8BmTafOijozdGrcx2GU4Rb812Ml4xeqs9a8RsviSaODAxSGjFoBy5b00DaJziTKU"
      STRIPE_CURRENCY: "uah"
      
    steps:
    - name: Deploy Backend and Frontend
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        
        script: |
          set -e
          DEPLOY_PATH="/home/ubuntu/${{ env.PROJECT_ROOT_DIR }}"
          echo "Pulling latest code from main..."
          cd $DEPLOY_PATH
          git fetch origin
          git reset --hard origin/main
          
          echo "Creating .env file with all configuration..."
          cat > $DEPLOY_PATH/.env << 'EOF'
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=${{ env.DEBUG_PROD }}
          ALLOWED_HOSTS=${{ env.ALLOWED_HOSTS_PROD }}
          RDS_DB_NAME=${{ env.RDS_DB_NAME }}
          RDS_USERNAME=${{ env.RDS_USERNAME }}
          RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}
          RDS_HOSTNAME=${{ secrets.RDS_HOSTNAME }}
          RDS_PORT=${{ env.RDS_PORT }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC_KEY=${{ env.STRIPE_PUBLIC_KEY }}
          STRIPE_CURRENCY=${{ env.STRIPE_CURRENCY }}
          EOF
          
          echo "Installing Python dependencies..."
          source $DEPLOY_PATH/venv/bin/activate
          pip install -r $DEPLOY_PATH/requirements.txt
          
          echo "Running migrations..."
          python $DEPLOY_PATH/manage.py migrate --noinput
          
          echo "Collecting static files..."
          python $DEPLOY_PATH/manage.py collectstatic --noinput
          
          echo "Building Frontend..."
          cd $DEPLOY_PATH/frontend
          npm install
          rm -rf build
          npm run build
          
          echo "Restarting services..."
          sudo systemctl daemon-reload
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
          
          echo "✅ Deployment completed successfully!"
