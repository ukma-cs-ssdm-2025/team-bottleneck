name: Deploy to EC2
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT_DIR: team-bottleneck
      ALLOWED_HOSTS_PROD: "16.170.148.253,localhost,127.0.0.1"
      DEBUG_PROD: "False"
      
    steps:
    - name: Deploy Backend and Frontend
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        
        script: |
          set -e
          
          export SECRET_KEY_PROD="${{ secrets.DJANGO_SECRET_KEY }}"
          export ALLOWED_HOSTS="${{ env.ALLOWED_HOSTS_PROD }}"
          export DEBUG="${{ env.DEBUG_PROD }}"
          DEPLOY_PATH="/home/ubuntu/${{ env.PROJECT_ROOT_DIR }}"
          
          echo "Pulling latest code from main..."
          cd $DEPLOY_PATH
          git fetch origin
          git reset --hard origin/main
          
          echo "Creating .env file..."
          echo "DJANGO_SECRET_KEY=$SECRET_KEY_PROD" > $DEPLOY_PATH/.env
          echo "DJANGO_DEBUG=$DEBUG" >> $DEPLOY_PATH/.env
          echo "ALLOWED_HOSTS=$ALLOWED_HOSTS" >> $DEPLOY_PATH/.env
          echo "RDS_DB_NAME=" >> $DEPLOY_PATH/.env
          echo "RDS_USERNAME=" >> $DEPLOY_PATH/.env
          echo "RDS_PASSWORD=" >> $DEPLOY_PATH/.env
          echo "RDS_HOSTNAME=" >> $DEPLOY_PATH/.env
          echo "RDS_PORT=" >> $DEPLOY_PATH/.env
          
          echo "Installing Python dependencies..."
          source $DEPLOY_PATH/venv/bin/activate
          pip install -r $DEPLOY_PATH/requirements.txt
          
          echo "Running migrations..."
          python $DEPLOY_PATH/manage.py migrate --noinput
          
          echo "Collecting static files..."
          python $DEPLOY_PATH/manage.py collectstatic --noinput
          
          echo "Building Frontend..."
          cd $DEPLOY_PATH/frontend
          npm install
          rm -rf build
          npm run build
          
          echo "Restarting services..."
          sudo systemctl daemon-reload
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
          
          echo "✅ Deployment completed successfully!"
