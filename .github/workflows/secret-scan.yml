name: Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Docker)
        run: |
          docker run --rm -v "$PWD":/path ghcr.io/gitleaks/gitleaks:latest \
            git -v --no-banner --redact \
            --report-format sarif --report-path /path/gitleaks.sarif \
            --report-format json  --report-path /path/gitleaks.json || true

      - name: Summarize findings
        run: |
          echo "## Gitleaks findings summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -s gitleaks.json ]; then
            count=$(jq 'length' gitleaks.json)
            echo "- Findings: **$count**" >> "$GITHUB_STEP_SUMMARY"
            if [ "$count" -gt 0 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "| RuleID | File | Line |" >> "$GITHUB_STEP_SUMMARY"
              echo "|-------:|------|-----:|" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) |"' gitleaks.json | head -n 20 >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "_Shown first 20 only. See artifact for full report._" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- No report generated (file missing)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: |
            gitleaks.sarif
            gitleaks.json
