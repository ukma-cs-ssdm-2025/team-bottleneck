name: Run API Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/api/**'
      - '.github/workflows/run_tests.yml'

jobs:
  test:
    name: Run Django API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Assuming a Python/Django Project)
        run: |
          python -m pip install --upgrade pip
          pip install requirements.txt
          pip install django pytest-django

      - name: Run Pytest for API
        run: |
          export DJANGO_SETTINGS_MODULE=src.parking.settings
          pytest src/api/tests/
