name: Run API Tests
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/api/**'
      - '.github/workflows/RunUnitTests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/api/**'
      - '.github/workflows/RunUnitTests.yml'
jobs:
  test:
    name: Run Django API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-django pytest-cov
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          EOF
      
      - name: Run Pytest with Coverage
        env:
          DJANGO_SETTINGS_MODULE: src.parking.settings
        run: |
          pytest src/api/tests/ \
            --cov=src/api \
            --cov-report=html \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit.xml \
            -v --tb=short
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            .pytest_cache/
            coverage.xml
            junit.xml
          retention-days: 7
      
      - name: PR coverage comment
        if: success() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: junit.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }} 
          DJANGO_DEBUG: True
      
      - name: Generate coverage badge
        if: success() && github.event_name == 'push'
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg
          overwrite: true
      
      - name: Commit coverage badge to coverage-badge branch
        if: success() && github.event_name == 'push'
        uses: EndBug/add-and-commit@v9.1.4
        with:
          add: coverage.svg
          message: "chore(ci): update coverage badge [skip ci]"
          new_branch: coverage-badge
          push: origin coverage-badge --force
