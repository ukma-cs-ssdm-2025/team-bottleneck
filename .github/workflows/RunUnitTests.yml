name: Run API Tests
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/api/**'
      - 'docs/api/openapi-generated.yaml'
      - 'docs/index.html'
      - '.github/workflows/RunUnitTests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/api/**'
      - '.github/workflows/RunUnitTests.yml'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Django API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-django pytest-cov
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}
          STRONG_PASSWORD_FOR_TESTS=${{ secrets.STRONG_PASSWORD_FOR_TESTS }}
          EOF
      
      - name: Run Pytest with Coverage
        env:
          DJANGO_SETTINGS_MODULE: src.parking.settings
        run: |
          pytest src/api/tests/ \
            --cov=src/api \
            --cov-report=html \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit.xml \
            -v --tb=short
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            .pytest_cache/
            coverage.xml
            junit.xml
          retention-days: 7
      
      - name: PR coverage comment
        if: success() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: junit.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }} 
          DJANGO_DEBUG: True
      
      - name: Generate coverage badge
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: htmlcov/coverage.svg
          overwrite: true
      
      - name: Prepare Pages deployment
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp docs/index.html pages/
          mkdir -p pages/htmlcov
          cp -r htmlcov/* pages/htmlcov/
          cp htmlcov/coverage.svg pages/coverage.svg
          mkdir -p pages/api
          cp docs/api/openapi-generated.yaml pages/api/
      
      - name: Upload Pages artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
  
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
