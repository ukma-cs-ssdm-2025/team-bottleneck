components:
  schemas:
    Booking:
      properties:
        cancellation_reason:
          readOnly: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        end_at:
          format: date-time
          type: string
        id:
          readOnly: true
          type: integer
        payment_intent_id:
          readOnly: true
          type: string
        spot:
          type: integer
        start_at:
          format: date-time
          type: string
        status:
          readOnly: true
          type: string
        user:
          nullable: true
          readOnly: true
          type: integer
      required:
      - cancellation_reason
      - created_at
      - end_at
      - id
      - payment_intent_id
      - spot
      - start_at
      - status
      - user
      type: object
    BookingCancel:
      properties:
        reason:
          maxLength: 200
          type: string
      type: object
    BookingCreate:
      properties:
        end_at:
          format: date-time
          type: string
        spot:
          type: integer
        start_at:
          format: date-time
          type: string
      required:
      - end_at
      - spot
      - start_at
      type: object
    Error:
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - detail
      type: object
    OperatorAssign:
      properties:
        lot_id:
          type: integer
      required:
      - lot_id
      type: object
    OperatorBookingCancel:
      properties:
        reason:
          description: "\u041F\u0440\u0438\u0447\u0438\u043D\u0430 \u0441\u043A\u0430\
            \u0441\u0443\u0432\u0430\u043D\u043D\u044F \u0431\u0440\u043E\u043D\u044E\
            \u0432\u0430\u043D\u043D\u044F \u043E\u043F\u0435\u0440\u0430\u0442\u043E\
            \u0440\u043E\u043C."
          maxLength: 255
          type: string
      required:
      - reason
      type: object
    PaginatedBookingList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?page=4
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?page=2
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/Booking'
          type: array
      required:
      - count
      - results
      type: object
    PaginatedParkingLotList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?page=4
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?page=2
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/ParkingLot'
          type: array
      required:
      - count
      - results
      type: object
    PaginatedSpotList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?page=4
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?page=2
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/Spot'
          type: array
      required:
      - count
      - results
      type: object
    PaginatedUserList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?page=4
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?page=2
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
      - count
      - results
      type: object
    ParkingLot:
      properties:
        building:
          maxLength: 20
          type: string
        city:
          maxLength: 100
          type: string
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 100
          type: string
        street:
          maxLength: 150
          type: string
      required:
      - city
      - id
      - name
      - street
      type: object
    ParkingLotDetail:
      properties:
        building:
          maxLength: 20
          type: string
        city:
          maxLength: 100
          type: string
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 100
          type: string
        spots:
          items:
            $ref: '#/components/schemas/Spot'
          readOnly: true
          type: array
        street:
          maxLength: 150
          type: string
      required:
      - city
      - id
      - name
      - spots
      - street
      type: object
    PatchedParkingLotDetail:
      properties:
        building:
          maxLength: 20
          type: string
        city:
          maxLength: 100
          type: string
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 100
          type: string
        spots:
          items:
            $ref: '#/components/schemas/Spot'
          readOnly: true
          type: array
        street:
          maxLength: 150
          type: string
      type: object
    PatchedSpotOperatorUpdate:
      description: "Serializer for operators \u2014 restricts updates to allowed fields."
      properties:
        is_disabled:
          type: boolean
        is_ev:
          type: boolean
      type: object
    PatchedUserProfileUpdate:
      properties:
        first_name:
          maxLength: 150
          type: string
        last_name:
          maxLength: 150
          type: string
      type: object
    Spot:
      properties:
        created_by:
          nullable: true
          readOnly: true
          type: integer
        created_by_username:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        is_disabled:
          type: boolean
        is_ev:
          type: boolean
        lot:
          readOnly: true
          type: integer
        number:
          maxLength: 10
          type: string
      required:
      - created_by
      - created_by_username
      - id
      - lot
      - number
      type: object
    SpotOperatorUpdate:
      description: "Serializer for operators \u2014 restricts updates to allowed fields."
      properties:
        is_disabled:
          type: boolean
        is_ev:
          type: boolean
      type: object
    TokenObtainPair:
      properties:
        access:
          readOnly: true
          type: string
        password:
          type: string
          writeOnly: true
        refresh:
          readOnly: true
          type: string
        username:
          type: string
          writeOnly: true
      required:
      - access
      - password
      - refresh
      - username
      type: object
    TokenRefresh:
      properties:
        access:
          readOnly: true
          type: string
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
      type: object
    User:
      properties:
        email:
          format: email
          readOnly: true
          title: Email address
          type: string
        first_name:
          maxLength: 150
          type: string
        id:
          readOnly: true
          type: integer
        is_operator:
          readOnly: true
          type: boolean
        is_staff:
          type: boolean
        last_name:
          maxLength: 150
          type: string
        lot_id:
          nullable: true
          readOnly: true
          type: integer
        username:
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
          type: string
      required:
      - email
      - id
      - is_operator
      - is_staff
      - lot_id
      - username
      type: object
    UserProfileUpdate:
      properties:
        first_name:
          maxLength: 150
          type: string
        last_name:
          maxLength: 150
          type: string
      type: object
    UserRegistration:
      properties:
        email:
          format: email
          maxLength: 254
          title: Email address
          type: string
        first_name:
          maxLength: 150
          type: string
        last_name:
          maxLength: 150
          type: string
        password:
          type: string
          writeOnly: true
        username:
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          maxLength: 150
          pattern: ^[\w.@+-]+$
          type: string
      required:
      - email
      - password
      - username
      type: object
  securitySchemes:
    jwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Search lots/spots, book & cancel.
  title: Smart Parking API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/schema/:
    get:
      description: 'OpenApi3 schema for this API. Format can be selected via content
        negotiation.


        - YAML: application/vnd.oai.openapi

        - JSON: application/vnd.oai.openapi+json'
      operationId: api_schema_retrieve
      parameters:
      - in: query
        name: format
        schema:
          enum:
          - json
          - yaml
          type: string
      - in: query
        name: lang
        schema:
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
            application/vnd.oai.openapi:
              schema:
                additionalProperties: {}
                type: object
            application/vnd.oai.openapi+json:
              schema:
                additionalProperties: {}
                type: object
            application/yaml:
              schema:
                additionalProperties: {}
                type: object
          description: ''
      security:
      - jwtAuth: []
      - {}
      tags:
      - api
  /api/v1/bookings/:
    get:
      description: Returns a list of all bookings for the *current authenticated user*.
      operationId: api_v1_bookings_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Filter by booking status
        in: query
        name: status
        schema:
          enum:
          - cancelled
          - confirmed
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
      security:
      - jwtAuth: []
      summary: '[Client] List my bookings'
      tags:
      - api
  /api/v1/bookings/create/:
    post:
      description: Creates a new parking spot booking. A mock payment process is initiated
        upon creation.
      operationId: api_v1_bookings_create_create
      requestBody:
        content:
          application/json:
            examples:
              ValidRequest:
                summary: Valid request
                value:
                  end_at: '2025-10-15T12:00:00Z'
                  spot: 10
                  start_at: '2025-10-15T10:00:00Z'
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                ValidRequest:
                  summary: Valid request
                  value:
                    end_at: '2025-10-15T12:00:00Z'
                    spot: 10
                    start_at: '2025-10-15T10:00:00Z'
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid time range or data
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The spot is already booked for this period
      security:
      - jwtAuth: []
      summary: '[Client] Create a new booking'
      tags:
      - api
  /api/v1/bookings/my-lot-bookings/:
    get:
      description: Returns a list of all bookings for the parking lot *assigned to
        the authenticated operator*.
      operationId: api_v1_bookings_my_lot_bookings_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - You are not an operator or not assigned to a lot
      security:
      - jwtAuth: []
      summary: '[Operator] List bookings for my lot'
      tags:
      - api
  /api/v1/bookings/{id}/:
    get:
      description: Returns detailed information about a specific booking belonging
        to the *current user*.
      operationId: api_v1_bookings_retrieve
      parameters:
      - description: A unique integer value identifying this booking.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking not found or belongs to another user
      security:
      - jwtAuth: []
      summary: '[Client] Get booking details'
      tags:
      - api
  /api/v1/bookings/{id}/cancel-operator/:
    post:
      description: Allows an operator to cancel *any* booking within their assigned
        lot. Requires a reason.
      operationId: api_v1_bookings_cancel_operator_create
      parameters:
      - description: A unique integer value identifying this booking.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorBookingCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperatorBookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperatorBookingCancel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking already cancelled or completed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden - You do not have permission for this booking's lot
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking not found
      security:
      - jwtAuth: []
      summary: '[Operator] Cancel a booking in my lot'
      tags:
      - api
  /api/v1/bookings/{id}/cancel/:
    post:
      description: Cancels an existing booking *belonging to the current user*. A
        mock refund is triggered.
      operationId: api_v1_bookings_cancel_create
      parameters:
      - description: A unique integer value identifying this booking.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            examples:
              ValidRequest:
                summary: Valid request
                value:
                  reason: Changed plans
            schema:
              $ref: '#/components/schemas/BookingCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCancel'
      responses:
        '200':
          content:
            application/json:
              examples:
                ValidRequest:
                  summary: Valid request
                  value:
                    reason: Changed plans
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking already cancelled
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking not found or belongs to another user
      security:
      - jwtAuth: []
      summary: '[Client] Cancel my booking'
      tags:
      - api
  /api/v1/lots/:
    get:
      description: Return list of all available lots with base info (/api/v1/lots/).
      operationId: api_v1_lots_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingLotList'
          description: ''
      security:
      - jwtAuth: []
      - {}
      summary: List of all lots
      tags:
      - api
    post:
      operationId: api_v1_lots_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingLotDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParkingLotDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParkingLotDetail'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingLotDetail'
          description: ''
      security:
      - jwtAuth: []
      summary: '[Admin] Create a new lot'
      tags:
      - api
  /api/v1/lots/{id}/:
    delete:
      operationId: api_v1_lots_destroy
      parameters:
      - description: A unique integer value identifying this parking lot.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
      security:
      - jwtAuth: []
      summary: '[Admin] Delete a lot'
      tags:
      - api
    get:
      description: Returns detailed information about a specific parking lot, including
        a list of parking spots (/api/v1/lots/{id}/).
      operationId: api_v1_lots_retrieve
      parameters:
      - description: A unique integer value identifying this parking lot.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingLotDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Lot not found
      security:
      - jwtAuth: []
      - {}
      summary: Detailed info about lot
      tags:
      - api
    patch:
      operationId: api_v1_lots_partial_update
      parameters:
      - description: A unique integer value identifying this parking lot.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedParkingLotDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedParkingLotDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedParkingLotDetail'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingLotDetail'
          description: ''
      security:
      - jwtAuth: []
      summary: '[Admin] Partially update a lot'
      tags:
      - api
    put:
      operationId: api_v1_lots_update
      parameters:
      - description: A unique integer value identifying this parking lot.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingLotDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParkingLotDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParkingLotDetail'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingLotDetail'
          description: ''
      security:
      - jwtAuth: []
      summary: '[Admin] Update a lot'
      tags:
      - api
  /api/v1/lots/{lot_pk}/spots/:
    get:
      description: List of all parking spots in a specific parking lot. You can filter
        by type (EV, for disabled) and availability.
      operationId: api_v1_lots_spots_list
      parameters:
      - description: ISO datetime - show only available spots from this time
        in: query
        name: available_from
        schema:
          type: string
      - description: ISO datetime - show only available spots until this time
        in: query
        name: available_to
        schema:
          type: string
      - description: 'Filter: spots for people with disabilities (true/false)'
        in: query
        name: is_disabled
        schema:
          type: boolean
      - description: 'Filter: spots with EV charging (true/false)'
        in: query
        name: is_ev
        schema:
          type: boolean
      - in: path
        name: lot_pk
        required: true
        schema:
          type: integer
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSpotList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid filter parameters
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Parking lot not found
      security:
      - jwtAuth: []
      - {}
      summary: List of parking spots in a lot
      tags:
      - api
  /api/v1/lots/{lot_pk}/spots/create/:
    post:
      description: Allows an operator to create a new parking spot within their assigned
        lot.
      operationId: api_v1_lots_spots_create_create
      parameters:
      - in: path
        name: lot_pk
