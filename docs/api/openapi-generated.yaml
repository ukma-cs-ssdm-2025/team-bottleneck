openapi: 3.0.3
info:
  title: Smart Parking API
  version: 0.1.0
  description: Search lots/spots, book & cancel.
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/bookings/:
    get:
      operationId: v1_bookings_list
      description: Returns a list of all bookings for the current user (/api/v1/bookings/).
      summary: My bookings
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
        description: Filter by booking status
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
  /api/v1/bookings/{id}/:
    get:
      operationId: v1_bookings_retrieve
      description: Returns detailed information about a specific user booking (/api/v1/bookings/{id}/).
      summary: Booking details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this booking.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking not found or belongs to another user
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: Cancels an existing user booking. A mock refund process is triggered.
        (/api/v1/bookings/{id}/cancel/)
      summary: Cancel a booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this booking.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCancel'
            examples:
              ValidRequest:
                value:
                  reason: Changed plans
                summary: Valid request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCancel'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                ValidRequest:
                  value:
                    reason: Changed plans
                  summary: Valid request
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking already cancelled
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Booking not found or belongs to another user
  /api/v1/bookings/{id}/cancel-operator/:
    post:
      operationId: v1_bookings_cancel_operator_create
      description: |-
        - GET /api/v1/bookings/
        - GET /api/v1/bookings/{id}/
        - POST /api/v1/bookings/create/
        - POST /api/v1/bookings/{id}/cancel/
        - GET /api/v1/bookings/my-lot-bookings/
        - POST /api/v1/bookings/{id}/cancel-operator/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this booking.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Booking'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/create/:
    post:
      operationId: v1_bookings_create_create
      description: Creates a new parking spot booking. After successful creation,
        a mock Stripe payment process is initiated. (/api/v1/bookings/create/)
      summary: Create a booking
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            examples:
              ValidRequest:
                value:
                  spot: 10
                  start_at: '2025-10-15T10:00:00Z'
                  end_at: '2025-10-15T12:00:00Z'
                summary: Valid request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                ValidRequest:
                  value:
                    spot: 10
                    start_at: '2025-10-15T10:00:00Z'
                    end_at: '2025-10-15T12:00:00Z'
                  summary: Valid request
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid time range or data
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The spot is already booked for the selected period
  /api/v1/bookings/my-lot-bookings/:
    get:
      operationId: v1_bookings_my_lot_bookings_retrieve
      description: |-
        - GET /api/v1/bookings/
        - GET /api/v1/bookings/{id}/
        - POST /api/v1/bookings/create/
        - POST /api/v1/bookings/{id}/cancel/
        - GET /api/v1/bookings/my-lot-bookings/
        - POST /api/v1/bookings/{id}/cancel-operator/
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/lots/:
    get:
      operationId: v1_lots_list
      description: Return list of all available lots with base info (/api/v1/lots/).
      summary: List of all lots
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingLotList'
          description: ''
  /api/v1/lots/{lot_pk}/spots/:
    get:
      operationId: v1_lots_spots_list
      description: List of all parking spots in a specific parking lot. You can filter
        by type (EV, for disabled) and availability.
      summary: List of parking spots in a parking lot
      parameters:
      - in: query
        name: available_from
        schema:
          type: string
        description: ISO datetime - show only available spots from this time
      - in: query
        name: available_to
        schema:
          type: string
        description: ISO datetime - show only available spots until this time
      - in: query
        name: is_disabled
        schema:
          type: boolean
        description: 'Filter: spots for people with disabilities (true/false)'
      - in: query
        name: is_ev
        schema:
          type: boolean
        description: 'Filter: spots with EV charging (true/false)'
      - in: path
        name: lot_pk
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSpotList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid filter parameters
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Parking lot not found
  /api/v1/lots/{lot_pk}/spots/{id}/:
    get:
      operationId: v1_lots_spots_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this spot.
        required: true
      - in: path
        name: lot_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spot'
          description: ''
  /api/v1/lots/{lot_pk}/spots/{id}/operator-update/:
    patch:
      operationId: v1_lots_spots_operator_update_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this spot.
        required: true
      - in: path
        name: lot_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpot'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spot'
          description: ''
  /api/v1/lots/{lot_pk}/spots/create/:
    post:
      operationId: v1_lots_spots_create_create
      parameters:
      - in: path
        name: lot_pk
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Spot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Spot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Spot'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spot'
          description: ''
  /api/v1/lots/{id}/:
    get:
      operationId: v1_lots_retrieve
      description: Returns detailed information about a specific parking lot, including
        a list of parking spots (/api/v1/lots/{id}/).
      summary: Detailed info about lot (free spots/services)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this parking lot.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingLotDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Lot not found
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      description: 'GET: Returns current authenticated user details (Login check).
        PATCH: Updates profile data (first_name, last_name).'
      summary: Get/Update current user profile info
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
    patch:
      operationId: v1_users_me_partial_update
      description: 'GET: Returns current authenticated user details (Login check).
        PATCH: Updates profile data (first_name, last_name).'
      summary: Get/Update current user profile info
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
  /api/v1/users/register/:
    post:
      operationId: v1_users_register_create
      description: Creates a new user account with hashing the password. After registration,
        the user can use Basic Auth to log in.
      summary: Registration of a new user
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User successfully created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Validation error (e.g., username already exists, weak password)
components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        spot:
          type: integer
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        cancellation_reason:
          type: string
          readOnly: true
        payment_intent_id:
          type: string
          readOnly: true
          nullable: true
      required:
      - cancellation_reason
      - created_at
      - end_at
      - id
      - payment_intent_id
      - spot
      - start_at
      - status
      - user
    BookingCancel:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
    BookingCreate:
      type: object
      properties:
        spot:
          type: integer
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
      required:
      - end_at
      - spot
      - start_at
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - detail
    PaginatedBookingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    PaginatedParkingLotList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ParkingLot'
    PaginatedSpotList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Spot'
    ParkingLot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 150
        building:
          type: string
          nullable: true
          maxLength: 20
      required:
      - city
      - id
      - name
      - street
    ParkingLotDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 150
        building:
          type: string
          nullable: true
          maxLength: 20
        spots:
          type: array
          items:
            $ref: '#/components/schemas/Spot'
          readOnly: true
      required:
      - city
      - id
      - name
      - spots
      - street
    PatchedSpot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          maxLength: 10
        is_ev:
          type: boolean
        is_disabled:
          type: boolean
        lot:
          type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_username:
          type: string
          readOnly: true
    PatchedUserProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    Spot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          maxLength: 10
        is_ev:
          type: boolean
        is_disabled:
          type: boolean
        lot:
          type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_username:
          type: string
          readOnly: true
      required:
      - created_by
      - created_by_username
      - id
      - lot
      - number
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - id
      - username
    UserRegistration:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
